[pytest]
testpaths = test
pythonpath = .
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes
markers = 
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
console_output_style = progress
log_cli = true
log_cli_level = INFO
